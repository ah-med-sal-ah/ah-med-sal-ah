name: Update profile README cards

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight (UTC)
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=dracula
          path: stats-dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: stats-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=5&card_width=320&theme=dracula
          path: langs-dist/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to languages-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: langs-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake-dist/snake.svg?palette=github-dark

      - name: Push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: snake-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
